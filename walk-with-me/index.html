  <script>
    (() => {
      const root = document.documentElement;
      const revealHeroText = () => {
        const items = Array.from(document.querySelectorAll('.hero-text-drop'));
        if (!items.length) return;

        items.forEach((item, index) => {
          window.setTimeout(() => {
            item.classList.add('is-visible');
          }, index * 160);
        });
      };

      if (!root.classList.contains('project-entry-transition')) return;

      const prefersReducedMotion = window.matchMedia && window.matchMedia('(prefers-reduced-motion: reduce)').matches;

      try {
        JSON.parse(sessionStorage.getItem('mond:work-to-intermezzo') || '{}');
      } catch (error) {
        // The transition can continue without persisted state.
      }

      if (prefersReducedMotion) {
        root.classList.remove('project-entry-transition');
        revealHeroText();
        try {
          sessionStorage.removeItem('mond:work-to-intermezzo');
        } catch (error) {}
        return;
      }

      window.setTimeout(() => {
        root.classList.add('is-panel-exiting');
      }, 40);

      window.setTimeout(() => {
        root.classList.add('is-project-entry-ready');
        revealHeroText();
      }, 220);

      window.setTimeout(() => {
        root.classList.add('is-case-reveal-ready');
        window.dispatchEvent(new CustomEvent('mond:intermezzo-entry-reveal'));
      }, 340);

      window.setTimeout(() => {
        root.classList.remove('project-entry-transition');
        root.classList.remove('is-panel-exiting');
        root.classList.remove('is-project-entry-ready');
        root.classList.remove('is-case-reveal-ready');
        try {
          sessionStorage.removeItem('mond:work-to-intermezzo');
        } catch (error) {}
      }, 900);
    })();
  </script>

  <script>
    (function () {
      const header = document.querySelector('.hero__top');
      const menuToggle = document.getElementById('hero-menu-toggle');
      const nav = document.getElementById('hero-primary-nav');

      if (!header || !menuToggle || !nav) return;

      let closingTimer;

      const setMenuOpen = (isOpen) => {
        window.clearTimeout(closingTimer);
        menuToggle.setAttribute('aria-expanded', isOpen ? 'true' : 'false');
        menuToggle.setAttribute('aria-label', isOpen ? 'Close menu' : 'Open menu');

        if (isOpen) {
          header.classList.remove('is-open');
          header.classList.remove('is-closing');
          header.classList.add('is-preopening');
          nav.getBoundingClientRect();
          window.requestAnimationFrame(() => {
            header.classList.remove('is-preopening');
            header.classList.add('is-open');
          });
        } else {
          header.classList.remove('is-preopening');
          header.classList.toggle('is-closing', header.classList.contains('is-open'));
          header.classList.remove('is-open');
          closingTimer = window.setTimeout(() => {
            header.classList.remove('is-closing');
          }, 340);
        }
      };

      menuToggle.addEventListener('click', () => {
        setMenuOpen(!header.classList.contains('is-open'));
      });

      nav.addEventListener('click', (event) => {
        if (event.target.closest('a')) {
          setMenuOpen(false);
        }
      });

      document.addEventListener('keydown', (event) => {
        if (event.key === 'Escape') {
          setMenuOpen(false);
        }
      });

      const updateScrolledState = () => {
        document.body.classList.toggle('has-scrolled', window.scrollY > 0);
      };

      updateScrolledState();
      window.addEventListener('scroll', updateScrolledState, { passive: true });
    })();
  </script>
