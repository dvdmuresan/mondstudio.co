<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>MOND : STUDIO - Work in Progress</title>
  <link rel="preconnect" href="https://use.typekit.net">
  <link rel="stylesheet" href="https://use.typekit.net/rsz0lck.css">
  <link rel="stylesheet" href="https://use.typekit.net/xhp4yar.css">
  <link rel="stylesheet" href="https://use.typekit.net/did4gvj.css">
  <link rel="icon" type="image/png" href="1x/Asset 8-8.png">
  <style>
    *, *::before, *::after {
      box-sizing: border-box;
    }

    :root {
      --color-bg: #000000;
      --color-text: #f4f4f4;
      --color-muted: rgba(244, 244, 244, 0.58);
      --color-line: #1a1a1a;
      --color-field: rgba(255, 255, 255, 0.10);
      --color-field-border: #7e7e7e;
      --grid-line-image: linear-gradient(
        to right,
        transparent 0,
        transparent calc(25% - 0.5px),
        var(--color-line) calc(25% - 0.5px),
        var(--color-line) calc(25% + 0.5px),
        transparent calc(25% + 0.5px),
        transparent calc(50% - 0.5px),
        var(--color-line) calc(50% - 0.5px),
        var(--color-line) calc(50% + 0.5px),
        transparent calc(50% + 0.5px),
        transparent calc(75% - 0.5px),
        var(--color-line) calc(75% - 0.5px),
        var(--color-line) calc(75% + 0.5px),
        transparent calc(75% + 0.5px),
        transparent 100%
      );
    }

    html {
      min-height: 100%;
      background: var(--color-bg);
    }

    body {
      margin: 0;
      min-height: 100vh;
      background-color: var(--color-bg);
      background-image: var(--grid-line-image);
      background-repeat: repeat-y;
      background-size: 100% auto;
      color: var(--color-text);
      font-family: "degular", "Mona Sans", "Helvetica Neue", Arial, sans-serif;
      -webkit-font-smoothing: antialiased;
      text-rendering: geometricPrecision;
    }

    main {
      min-height: 100vh;
      display: grid;
      place-items: center;
      padding: 28px;
    }

    .edge-colon-markers {
      position: fixed;
      inset: 22px 10px;
      z-index: 1000;
      display: flex;
      justify-content: space-between;
      pointer-events: none;
      color: #ffffff;
      font-family: "Mona Sans", "Helvetica Neue", Arial, sans-serif;
      font-size: 16px;
      font-weight: 600;
      line-height: 1;
    }

    .edge-colon-markers__side {
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      align-items: center;
      height: 100%;
    }

    .edge-colon-markers__mark {
      display: block;
    }

    .wip {
      width: min(100%, 320px);
      display: grid;
      gap: 18px;
      justify-items: start;
    }

    .sr-only {
      position: absolute;
      width: 1px;
      height: 1px;
      padding: 0;
      margin: -1px;
      overflow: hidden;
      clip: rect(0, 0, 0, 0);
      white-space: nowrap;
      border: 0;
    }

    .wip__title {
      margin: 0;
      font-size: 13px;
      font-weight: 400;
      line-height: 1.2;
      letter-spacing: 0;
      text-transform: uppercase;
    }

    .wip__form {
      width: 100%;
      display: grid;
      gap: 10px;
    }

    .wip__field {
      width: 100%;
      height: 38px;
      border: 1px solid var(--color-field-border);
      border-radius: 8px;
      background: var(--color-field);
      color: var(--color-text);
      font: inherit;
      font-size: 13px;
      font-weight: 400;
      letter-spacing: 0;
      outline: none;
      padding: 0 11px;
      backdrop-filter: blur(4px);
      -webkit-backdrop-filter: blur(4px);
      transition: border-color 180ms ease, background-color 180ms ease;
    }

    .wip__field::placeholder {
      color: var(--color-muted);
      opacity: 1;
    }

    .wip__field:focus {
      border-color: rgba(255, 255, 255, 0.68);
      background: rgba(255, 255, 255, 0.055);
    }

    .wip__button {
      width: fit-content;
      min-width: 72px;
      height: calc(44px / 1.15);
      border: 1px solid #7e7e7e;
      border-radius: 8px;
      background: rgba(255, 255, 255, 0.10);
      color: var(--color-text);
      cursor: pointer;
      font-family: "Mona Sans", "Helvetica Neue", Arial, sans-serif;
      font-size: calc(15px / 1.15);
      font-weight: 400;
      letter-spacing: 0.8px;
      line-height: 1;
      padding: 0 calc(22px / 1.15);
      text-transform: uppercase;
      backdrop-filter: blur(4px);
      -webkit-backdrop-filter: blur(4px);
      transition: background-color 180ms ease, color 180ms ease, border-color 180ms ease, transform 160ms ease;
    }

    .wip__button:hover,
    .wip__button:focus-visible {
      background: rgba(255, 255, 255, 0.18);
      border-color: rgba(255, 255, 255, 0.35);
      color: var(--color-text);
      outline: none;
    }

    .wip__message {
      min-height: 16px;
      margin: 0;
      color: var(--color-muted);
      font-size: 11px;
      font-weight: 400;
      line-height: 1.3;
    }

    @media (max-width: 700px) {
      :root {
        --grid-line-image: linear-gradient(
          to right,
          transparent 0,
          transparent calc(50% - 0.5px),
          var(--color-line) calc(50% - 0.5px),
          var(--color-line) calc(50% + 0.5px),
          transparent calc(50% + 0.5px),
          transparent 100%
        );
      }

      main {
        place-items: end start;
        padding: 24px;
      }

      .wip {
        margin-bottom: 18vh;
      }
    }
  </style>
</head>
<body>
  <div class="edge-colon-markers" aria-hidden="true">
    <div class="edge-colon-markers__side">
      <span class="edge-colon-markers__mark">:</span>
      <span class="edge-colon-markers__mark">:</span>
      <span class="edge-colon-markers__mark">:</span>
      <span class="edge-colon-markers__mark">:</span>
      <span class="edge-colon-markers__mark">:</span>
    </div>
    <div class="edge-colon-markers__side">
      <span class="edge-colon-markers__mark">:</span>
      <span class="edge-colon-markers__mark">:</span>
      <span class="edge-colon-markers__mark">:</span>
      <span class="edge-colon-markers__mark">:</span>
      <span class="edge-colon-markers__mark">:</span>
    </div>
  </div>

  <main>
    <section class="wip" aria-label="Password access">
      <h1 class="wip__title">Work in progress</h1>
      <form class="wip__form" id="password-form">
        <label class="sr-only" for="password">Password</label>
        <input class="wip__field" id="password" name="password" type="password" autocomplete="current-password" placeholder="Password" required>
        <button class="wip__button" type="submit">Enter</button>
        <p class="wip__message" id="message" aria-live="polite"></p>
      </form>
    </section>
  </main>

  <script>
    const PASSWORD = "*MDS";
    const STORAGE_KEY = "mondAccessGranted";
    const form = document.querySelector("#password-form");
    const field = document.querySelector("#password");
    const message = document.querySelector("#message");

    try {
      if (sessionStorage.getItem(STORAGE_KEY) === "true") {
        window.location.href = "index.html";
      }
    } catch (error) {
      // If storage is unavailable, visitors can still submit the form.
    }

    form.addEventListener("submit", (event) => {
      event.preventDefault();

      if (field.value.trim() === PASSWORD) {
        try {
          sessionStorage.setItem(STORAGE_KEY, "true");
        } catch (error) {
          // Continue into the site even when session storage is unavailable.
        }

        window.location.href = "index.html";
        return;
      }

      message.textContent = "Incorrect password.";
      field.value = "";
      field.focus();
    });
  </script>
</body>
</html>
