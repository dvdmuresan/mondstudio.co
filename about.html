<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>MOND Studio — About</title>
  <link rel="stylesheet" href="https://use.typekit.net/rsz0lck.css" />
  <link rel="stylesheet" href="https://use.typekit.net/xhp4yar.css" />
  <style>
    :root {
      --color-bg: #080808;
      --color-panel: #151515;
      --color-fg: #f5f5f5;
      --color-muted: #a5a5a5;
      --color-white: #ffffff;
      --grid-line-color: rgba(255, 255, 255, 0.08);
      --grid-line-image: linear-gradient(
        to right,
        transparent 0,
        transparent calc(25% - 0.5px),
        var(--grid-line-color) calc(25% - 0.5px),
        var(--grid-line-color) calc(25% + 0.5px),
        transparent calc(25% + 0.5px),
        transparent calc(50% - 0.5px),
        var(--grid-line-color) calc(50% - 0.5px),
        var(--grid-line-color) calc(50% + 0.5px),
        transparent calc(50% + 0.5px),
        transparent calc(75% - 0.5px),
        var(--grid-line-color) calc(75% - 0.5px),
        var(--grid-line-color) calc(75% + 0.5px),
        transparent calc(75% + 0.5px),
        transparent 100%
      );
    }

    @font-face {
      font-family: 'NB International';
      src: url('NB International Regular Webfont.ttf') format('truetype');
      font-weight: 400;
      font-style: normal;
      font-display: swap;
    }

    @font-face {
      font-family: "Saans";
      src: url("FONT/Saans-TRIAL-Light.ttf") format("truetype");
      font-weight: 300;
      font-style: normal;
      font-display: swap;
    }

    @font-face {
      font-family: "Saans";
      src: url("FONT/Saans-TRIAL-Regular.ttf") format("truetype");
      font-weight: 400;
      font-style: normal;
      font-display: swap;
    }

    @font-face {
      font-family: "Saans";
      src: url("FONT/Saans-TRIAL-Medium.ttf") format("truetype");
      font-weight: 500;
      font-style: normal;
      font-display: swap;
    }

    *, *::before, *::after {
      box-sizing: border-box;
    }

    html {
      scroll-behavior: auto;
    }

    body {
      margin: 0;
      min-height: 100vh;
      background-color: var(--color-bg);
      background-image: var(--grid-line-image);
      background-repeat: repeat-y;
      background-size: 100% auto;
      color: var(--color-fg);
      font-family: "Saans", sans-serif;
      line-height: 1.44;
      text-rendering: optimizeLegibility;
      display: flex;
      flex-direction: column;
      overflow-x: hidden;
      position: relative;
      padding-bottom: 40px;
      color-scheme: dark;
    }

    body::before {
      content: "";
      position: fixed;
      inset: 0;
      z-index: -1;
      background-image: var(--grid-line-image);
      background-repeat: repeat-y;
      background-size: 100% auto;
      pointer-events: none;
    }

    main {
      flex: 1;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: clamp(120px, 16vw, 200px) 20px;
    }

    .placeholder {
      max-width: 640px;
      text-align: center;
      font-family: "Saans", sans-serif;
      font-size: 20px;
      color: var(--color-muted);
      letter-spacing: 0.08em;
      text-transform: uppercase;
    }

.footer-section {
  position: relative;
  width: min(100%, calc(100vw - 40px));
  min-height: calc(550px * 0.708 - 100px);
  background: var(--color-panel);
  color: var(--color-fg);
      border-radius: 7px;
      margin: 0 auto -20px;
      box-sizing: border-box;
      display: block;
      opacity: 0;
      transform: translateY(24px);
      transition: opacity 600ms ease, transform 420ms cubic-bezier(.2,.9,.2,1);
      will-change: opacity, transform, top;
      padding: 20px clamp(28px, 6vw, 48px) clamp(28px, 6vw, 48px) 20px;
      margin-top: 0;
      max-width: calc(100vw - 40px);
    }

.footer-section::before {
  content: '';
  position: absolute;
  inset: 0;
  border: 1px solid transparent;
  border-radius: 7px;
}

.footer-section.visible {
      opacity: 1;
      transform: translateY(0);
    }

.footer-content {
      position: relative;
      display: grid;
      grid-template-columns: repeat(12, minmax(0, 1fr));
      column-gap: clamp(28px, 6vw, 48px);
      row-gap: clamp(32px, 8vw, 56px);
      padding: 20px clamp(28px, 6vw, 48px) clamp(28px, 6vw, 48px) 20px;
      min-height: inherit;
    }

    .footer-brand-minimal {
      grid-column: 1 / span 3;
      align-self: start;
      justify-self: start;
      color: var(--color-fg);
      text-align: left;
      font-family: "Saans", sans-serif;
      font-size: 19px;
      font-style: normal;
      font-weight: 400;
      line-height: 25px;
    }

    .footer-copy-minimal {
      grid-column: 1 / span 4;
      align-self: end;
      color: var(--color-fg);
      text-align: left;
      font-family: "Saans", sans-serif;
      font-size: 15px;
      font-style: normal;
      font-weight: 400;
      line-height: normal;
      max-width: min(360px, 100%);
    }

    .footer-social-minimal {
      grid-column: 5 / span 5;
      align-self: start;
      display: flex;
      flex-wrap: wrap;
      justify-content: flex-start;
      column-gap: clamp(40px, 7vw, 96px);
      row-gap: clamp(12px, 5vw, 24px);
      color: var(--color-fg);
      font-family: "Saans", sans-serif;
      font-size: clamp(18px, 3vw, 28px);
      font-style: normal;
      font-weight: 400;
      line-height: normal;
      text-transform: uppercase;
      text-align: left;
    }

.footer-social-minimal a {
      position: relative;
      display: inline-flex;
      align-items: center;
      font-size: inherit;
      letter-spacing: 0.04em;
      text-transform: uppercase;
      font-weight: 500;
      color: var(--color-fg);
      text-decoration: none;
      transition: color 180ms ease;
    }



    .footer-social-minimal a:hover,
    .footer-social-minimal a:focus {
      outline: none;
      color: var(--color-fg);
    }

.footer-social-minimal a::after {
  content: '';
      position: absolute;
      left: 0;
      bottom: -6px;
      width: 100%;
      height: 2px;
      background: currentColor;
      transform: scaleX(0);
      transform-origin: left;
      transition: transform 220ms ease;
    }

    .footer-social-minimal a:hover::after,
    .footer-social-minimal a:focus::after {
      transform: scaleX(1);
    }

.footer-contact-block {
      grid-column: 5 / span 5;
      align-self: start;
      max-width: clamp(240px, 22vw, 280px);
      color: var(--color-fg);
      font-family: "Saans", sans-serif;
      font-size: 15px;
      font-style: normal;
      font-weight: 400;
      line-height: 22px;
      text-align: left;
    }

    @media (max-width: 900px) {
      .footer-content {
        grid-template-columns: repeat(6, minmax(0, 1fr));
        padding: clamp(32px, 8vw, 56px) clamp(24px, 7vw, 40px);
      }

      .footer-brand-minimal {
        grid-column: 1 / -1;
      }

      .footer-social-minimal {
        grid-column: 1 / -1;
        justify-content: flex-start;
        column-gap: clamp(28px, 7vw, 40px);
        row-gap: clamp(12px, 5vw, 20px);
        font-size: clamp(20px, 5vw, 26px);
      }

      .footer-contact-block {
        grid-column: 1 / -1;
        max-width: clamp(260px, 50vw, 320px);
      }

      .footer-copy-minimal {
        grid-column: 1 / -1;
        max-width: none;
      }
    }

    @media (max-width: 540px) {
      .footer-content {
        grid-template-columns: repeat(4, minmax(0, 1fr));
        row-gap: clamp(24px, 8vw, 40px);
      }

      .footer-social-minimal {
        justify-content: space-between;
        column-gap: clamp(20px, 8vw, 32px);
        font-size: clamp(18px, 6vw, 24px);
      }

      .footer-contact-block {
        width: 100%;
        font-size: 15px;
        line-height: 22px;
      }
    }

    @media (max-width: 640px) {
      .footer-section {
        position: relative;
        width: 100%;
        min-height: auto;
        transform: none;
        padding: clamp(36px, 10vw, 52px) 20px clamp(48px, 12vw, 64px);
        margin-top: 0;
        margin-bottom: -20px;
        margin-left: auto;
        margin-right: auto;
      }

      .footer-section.visible {
        transform: none;
      }

      .footer-content {
        grid-template-columns: repeat(1, minmax(0, 1fr));
        row-gap: clamp(28px, 8vw, 40px);
        padding: clamp(32px, 10vw, 52px) 20px clamp(48px, 12vw, 64px);
      }

      .footer-brand-minimal,
      .footer-social-minimal,
      .footer-contact-block,
      .footer-email,
      .footer-copy-minimal {
        grid-column: 1 / -1;
        width: auto;
      }

      .footer-brand-minimal {
        margin-bottom: 48px;
      }

      .footer-social-minimal {
        display: flex;
        flex-direction: column;
        gap: clamp(24px, 8vw, 32px);
        margin-top: 0;
      }

      .footer-contact-block {
        margin-top: clamp(48px, 10vw, 56px);
        width: calc(100% - 40px);
      }

      .footer-email {
        margin-top: clamp(24px, 8vw, 36px);
      }

      .footer-copy-minimal {
        margin-top: clamp(36px, 10vw, 48px);
      }
    }

.footer-email {
  color: var(--color-fg);
      text-decoration: underline;
    }
  </style>
</head>
<body>
  <main>
    <div class="placeholder">About content will be added soon.</div>
  </main>

  <footer class="footer-section visible" id="footer-section" aria-hidden="false">
    <div class="footer-content">
      <div class="footer-brand-minimal">MOND STUDIO</div>
      <nav class="footer-social-minimal" aria-label="Footer social links">
        <a href="https://facebook.com" target="_blank" rel="noopener noreferrer">FACEBOOK</a>
        <a href="https://instagram.com" target="_blank" rel="noopener noreferrer">INSTAGRAM</a>
        <a href="https://linkedin.com" target="_blank" rel="noopener noreferrer">LINKDIN</a>
      </nav>
      <div class="footer-contact-block">
        Mond Studio SRL<br>
        Street name here<br>
        4100321 Cluj-Napoca<br><br>
        <a class="footer-email" href="mailto:hello@mondstudio.com?subject=Hey%20there!%20I%20would%20like%20to%20work%20with%20you!">hello@mondstudio.com</a>
      </div>
      <div class="footer-copy-minimal">©2025 MOND STUDIO SRL All Rights Reserved</div>
    </div>
  </footer>

  <script>
    (function () {
      const STORAGE_KEY = 'mond-theme';
      const mediaQuery = window.matchMedia ? window.matchMedia('(prefers-color-scheme: dark)') : null;

      const readStoredTheme = () => {
        try {
          return window.localStorage.getItem(STORAGE_KEY);
        } catch (error) {
          return null;
        }
      };

      const applyTheme = (theme) => {
        const resolved = theme === 'light' ? 'light' : 'dark';
        document.body.dataset.theme = resolved;
        document.body.style.colorScheme = resolved;
      };

      const storedTheme = readStoredTheme();
      const initialTheme = storedTheme || (mediaQuery && mediaQuery.matches ? 'dark' : 'light');
      applyTheme(initialTheme);

      if (!storedTheme && mediaQuery) {
        const handlePreferenceChange = (event) => {
          if (readStoredTheme()) return;
          applyTheme(event.matches ? 'dark' : 'light');
        };

        if (typeof mediaQuery.addEventListener === 'function') {
          mediaQuery.addEventListener('change', handlePreferenceChange);
        } else if (typeof mediaQuery.addListener === 'function') {
          mediaQuery.addListener(handlePreferenceChange);
        }
      }
    })();
  </script>
</body>
</html>
